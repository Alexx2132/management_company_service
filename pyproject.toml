[project]
name = "management-company-backend"
version = "0.1.0"
description = "FastAPI backend for the management company service"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "alembic==1.18.3",
    "asyncpg==0.31.0",
    "bcrypt==5.0.0",
    "fastapi==0.128.0",
    "firebase-admin==7.4.0",
    "pillow>=12.1.1,<13",
    "pydantic==2.12.5",
    "pydantic-settings==2.12.0",
    "python-jose[cryptography]==3.5.0",
    "python-multipart==0.0.22",
    "SQLAlchemy[asyncio]==2.0.46",
    "tzdata==2026.2",
    "uvicorn[standard]==0.40.0",
]

[dependency-groups]
dev = ["httpx==0.28.1"]

[tool.uv]
package = false
required-version = ">=0.13.0"
